  <!-- Text HYDROMETRA -->
  <text x="80" y="142" font-family="'Space Grotesk', 'Outfit', sans-serif" font-size="11" font-weight="800" fill="#fefffd" text-anchor="middle" letter-spacing="2">HYDROMETRA</text>
