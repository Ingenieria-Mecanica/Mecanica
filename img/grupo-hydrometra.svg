  <path d="M42 82 C55 82, 65 72, 80 72 C95 72, 105 82, 118 82 L112 88 C102 88, 92 78, 80 78 C68 78, 58 88, 48 88 Z" fill="#ffffff" />
  
  <!-- Wave dynamic lines -->
