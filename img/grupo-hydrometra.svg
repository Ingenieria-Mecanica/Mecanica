  <path d="M44 120 C60 126, 72 122, 80 124 C88 126, 100 122, 116 120" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  
  <!-- Propeller / Hydrofoil fin -->
