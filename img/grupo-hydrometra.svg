      <stop offset="0%" stop-color="#0a1f3e" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8af3c" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  <!-- Background circular badge -->
  <circle cx="80" cy="80" r="76" fill="#0a1f3e" />
  <circle cx="80" cy="80" r="70" fill="#0c2347" stroke="#f8af3c" stroke-width="2.5" />
  
